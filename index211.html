<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario de reactivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#070b14;--panel:#0e1524;--panel2:#131d31;--line:#1f2f4d;--tx:#d8e4f7;--mut:#7f92b3;--acc:#3ddcff;--warn:#ffb547;--bad:#ff6b7a;--ok:#5be3a4;
--head:'Chakra Petch',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(1200px 500px at 80% -10%,#0f2444 0,transparent 60%),var(--bg);color:var(--tx);font:15px/1.5 var(--body)}
.wrap{max-width:1240px;margin:0 auto;padding:20px 18px 40px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}
h1{font:600 26px/1.1 var(--head);margin:0;letter-spacing:.02em}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.src{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font:12px var(--mono);color:var(--mut);border:1px solid var(--line);padding:5px 10px;border-radius:99px}
.pill b{color:var(--acc);font-weight:500}
button,.btn{font:500 14px var(--body);cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);padding:8px 14px}
button:hover,.btn:hover{border-color:var(--acc)}
.primary{background:var(--acc);color:#04121a;border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.notice{margin:16px 0 0;padding:10px 14px;border:1px solid #5a4520;background:#1d1608;color:var(--warn);border-radius:6px;font-size:13px}
.ruler{margin:22px 0 6px}
.ruler h2,.panel h2{font:600 15px var(--head);margin:0 0 10px;letter-spacing:.03em}
.ruler .hint{color:var(--mut);font-size:12px;margin-left:8px;font-family:var(--body);font-weight:400}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;align-items:flex-end;min-height:96px}
.chip{flex:0 0 48px;height:82px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;padding:6px 0 6px;background:var(--panel);position:relative}
.chip .bar{width:22px;background:linear-gradient(#3ddcff,#1b6d86);border-radius:2px 2px 0 0;min-height:2px;transition:height .25s}
.chip .n{font:11px var(--mono);color:var(--mut)}
.chip .c{font:500 13px var(--mono)}
.chip[aria-pressed=true]{border-color:var(--acc);background:#0d2a3a;box-shadow:0 0 0 1px var(--acc) inset}
.chip[aria-pressed=true] .c{color:var(--acc)}
.grid{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
form label{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;background:#09101d;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:14px var(--body)}
input::placeholder{color:#4d5f80}
input:focus,select:focus{border-color:var(--acc);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--tx)!important;font-size:14px!important}
.chk input{width:auto}
.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-bottom:10px}
.meta b{color:var(--tx);font-family:var(--mono);font-weight:500}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:500 12px var(--body);color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #16233c;vertical-align:top}
tr.r{cursor:pointer}tr.r:hover td{background:#101a2e}
.f{font:12.5px var(--mono);color:var(--acc)}
.cas,.cc{font:13px var(--mono)}
.tag{display:inline-block;font:12px var(--mono);padding:2px 8px;border-radius:4px;border:1px solid var(--line);margin:0 4px 4px 0}
.ok{color:var(--ok);border-color:#1f5a41}.warn{color:var(--warn);border-color:#5a4520}.bad{color:var(--bad);border-color:#652a31}
.det td{background:#0a1220;padding:12px 14px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 18px}
.dl div span{display:block;font-size:11.5px;color:var(--mut)}
.empty{padding:40px 10px;text-align:center;color:var(--mut)}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Inventario de reactivos</h1><div class="sub">Laboratorio de química - 2-11</div></div>
  <div class="src">
    <span class="pill" id="srcInfo">sin datos</span>
    <label class="btn primary" for="file" tabindex="0">Cargar Excel del inventario</label>
    <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
    <button id="demo" type="button">Ver datos de ejemplo</button>
  </div>
</header>
<div id="notice"></div>

<section class="ruler">
  <h2>Número de carbonos <span class="hint">Selecciona uno o varios; la altura indica cuántos reactivos coinciden con el resto de filtros.</span></h2>
  <div class="strip" id="strip"></div>
</section>

<div class="grid">
  <form class="panel" id="f" autocomplete="off">
    <h2>Búsqueda avanzada</h2>
    <label for="q_nombre">Nombre del reactivo</label><input id="q_nombre" placeholder="p. ej. etanol">
    <div class="row2">
      <div><label for="q_formula">Fórmula</label><input id="q_formula" placeholder="C2H6O"></div>
      <div><label for="q_cas">CAS</label><input id="q_cas" placeholder="64-17-5"></div>
    </div>
    <label for="q_grupo">Grupo funcional</label><select id="q_grupo"><option value="">Todos</option></select>
    <div class="row2">
      <div><label for="q_estado">Estado físico</label><select id="q_estado"><option value="">Todos</option></select></div>
      <div><label for="q_ubicacion">Ubicación</label><select id="q_ubicacion"><option value="">Todas</option></select></div>
    </div>
    <label for="q_marca">Marca / proveedor</label><input id="q_marca">
    <div class="row2">
      <div><label for="q_pureza">Pureza mín. (%)</label><input id="q_pureza" type="number" min="0" max="100" step="any"></div>
      <div><label for="q_cant">Cantidad mín.</label><input id="q_cant" type="number" min="0" step="any"></div>
    </div>
    <label for="q_cad">Caducidad</label>
    <select id="q_cad"><option value="">Cualquiera</option><option value="exp">Caducados</option><option value="90">Caducan en 90 días o menos</option><option value="ok">Vigentes</option></select>
    <label class="chk"><input type="checkbox" id="q_stock"> Solo con existencias</label>
    <div class="actions"><button type="submit" class="primary">Buscar</button><button type="button" id="clear">Limpiar</button></div>
  </form>

  <section class="panel">
    <div class="meta"><span id="count"></span><span>Clic en una fila para ver el detalle</span></div>
    <div class="tw"><table>
      <thead><tr><th>Reactivo</th><th>CAS</th><th>C</th><th>Grupo</th><th>Ubicación</th><th>Existencias</th><th>Estado</th></tr></thead>
      <tbody id="body"></tbody>
    </table></div>
    <div class="empty" id="empty" hidden></div>
  </section>
</div>
</div>

<script>
const ALIAS={
 nombre:['nombre','reactivo','compuesto','name','sustancia'],
 formula:['formula','formula molecular'],
 cas:['cas','n cas','no cas','numero cas'],
 carbonos:['carbonos','c','n carbonos','numero de carbonos','no de carbonos'],
 grupo:['grupo funcional','grupo','familia','tipo','clase'],
 ubicacion:['ubicacion','estante','localizacion','gabinete','posicion'],
 estado:['estado fisico','estado','fase'],
 pureza:['pureza','purity','pureza %'],
 cantidad:['cantidad','stock','existencia','existencias','cantidad disponible'],
 unidad:['unidad','unidades'],
 marca:['marca','proveedor','fabricante'],
 caducidad:['caducidad','vencimiento','fecha de caducidad','fecha de vencimiento'],
 peligro:['peligro','riesgo','pictograma','pictogramas','peligrosidad','hazard']
};
const LABEL={nombre:'Nombre',formula:'Fórmula',cas:'CAS',carbonos:'Carbonos',grupo:'Grupo funcional',ubicacion:'Ubicación',estado:'Estado físico',pureza:'Pureza',cantidad:'Cantidad',unidad:'Unidad',marca:'Marca / proveedor',caducidad:'Caducidad',peligro:'Peligrosidad'};
const $=id=>document.getElementById(id);
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9% ]/g,' ').replace(/\s+/g,' ').trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DATA=[],SRC='',SEL=new Set();

function fieldFor(header){
  const h=norm(header);
  for(const k in ALIAS) if(ALIAS[k].includes(h)) return k;
  for(const k in ALIAS) if(k!=='carbonos' && ALIAS[k].some(a=>a.length>3&&h.includes(a))) return k;
  return null;
}
function toDate(v){
  if(!v) return null;
  if(v instanceof Date) return isNaN(v)?null:v;
  const d=new Date(v); if(!isNaN(d)) return d;
  const m=String(v).match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/);
  return m? new Date(+m[3]<100?2000+ +m[3]:+m[3],+m[2]-1,+m[1]):null;
}
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
function carbonsFrom(rec,sheet){
  let n=num(rec.carbonos); if(n!=null) return Math.round(n);
  const m=String(rec.formula||'').match(/C(\d*)(?![a-z])/);
  if(m) return m[1]?+m[1]:1;
  const s=String(sheet).match(/c\s*(\d+)/i)||String(sheet).match(/^\s*(\d+)/);
  return s?+s[1]:null;
}
function parseBook(wb){
  const out=[];
  wb.SheetNames.forEach(name=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:'',raw:true});
    if(!rows.length) return;
    const map={};Object.keys(rows[0]).forEach(h=>{map[h]=fieldFor(h)});
    rows.forEach(r=>{
      const rec={extra:{}};
      for(const h in r){
        const k=map[h]; const v=r[h]; if(v===''||v==null) continue;
        if(k && rec[k]==null) rec[k]=v; else if(!k) rec.extra[h]=v instanceof Date?v.toISOString().slice(0,10):v;
      }
      if(!rec.nombre && !rec.formula && !rec.cas) return;
      rec.c=carbonsFrom(rec,name); rec.hoja=name;
      const d=toDate(rec.caducidad); rec.dias=d?Math.round((d-Date.now())/864e5):null;
      if(d) rec.caducidad=d.toISOString().slice(0,10);
      out.push(rec);
    });
  });
  return out;
}
function setData(rows,src,isDemo){
  DATA=rows;SRC=src;SEL=new Set();
  $('srcInfo').innerHTML=`<b>${rows.length}</b> reactivos · ${esc(src)}`;
  $('notice').innerHTML=isDemo?'<div class="notice">Estás viendo datos de ejemplo. Carga el Excel de tu inventario para consultar los reactivos reales.</div>':'';
  fillSelects();render();
}
function fillSelects(){
  [['grupo','q_grupo','Todos'],['estado','q_estado','Todos'],['ubicacion','q_ubicacion','Todas']].forEach(([k,id,all])=>{
    const vals=[...new Set(DATA.map(r=>r[k]).filter(Boolean).map(String))].sort((a,b)=>a.localeCompare(b,'es'));
    $(id).innerHTML=`<option value="">${all}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join('');
  });
}
const val=id=>$(id).value.trim();
const has=(v,q)=>!q||norm(v??'').includes(norm(q));
function match(r,skipC){
  if(!skipC&&SEL.size&&!SEL.has(r.c)) return false;
  if(!has(r.nombre,val('q_nombre'))||!has(r.formula,val('q_formula'))||!has(r.cas,val('q_cas'))||!has(r.marca,val('q_marca'))) return false;
  for(const [k,id] of [['grupo','q_grupo'],['estado','q_estado'],['ubicacion','q_ubicacion']]) if(val(id)&&String(r[k]||'')!==val(id)) return false;
  const p=num(val('q_pureza')); if(p!=null&&!(num(r.pureza)>=p)) return false;
  const q=num(val('q_cant')); if(q!=null&&!(num(r.cantidad)>=q)) return false;
  if($('q_stock').checked&&!(num(r.cantidad)>0)) return false;
  const cad=val('q_cad');
  if(cad==='exp'&&!(r.dias!=null&&r.dias<0)) return false;
  if(cad==='90'&&!(r.dias!=null&&r.dias>=0&&r.dias<=90)) return false;
  if(cad==='ok'&&!(r.dias==null||r.dias>=0)) return false;
  return true;
}
function estado(r){
  if(r.dias==null) return '';
  if(r.dias<0) return '<span class="tag bad">Caducado</span>';
  if(r.dias<=90) return `<span class="tag warn">Caduca en ${r.dias} d</span>`;
  return '<span class="tag ok">Vigente</span>';
}
function renderStrip(){
  const cs=DATA.map(r=>r.c).filter(c=>c!=null);
  if(!cs.length){$('strip').innerHTML='<span class="sub">Sin datos de carbonos.</span>';return}
  const lo=Math.min(...cs),hi=Math.min(Math.max(...cs),60),cnt={};
  DATA.forEach(r=>{if(r.c!=null&&match(r,true))cnt[r.c]=(cnt[r.c]||0)+1});
  const mx=Math.max(1,...Object.values(cnt));let h='';
  for(let c=lo;c<=hi;c++){const n=cnt[c]||0;
    h+=`<button type="button" class="chip" data-c="${c}" aria-pressed="${SEL.has(c)}" title="${n} reactivos con C${c}"><span class="n">${n}</span><span class="bar" style="height:${Math.round(n/mx*38)}px"></span><span class="c">C${c}</span></button>`}
  $('strip').innerHTML=h;
}
function render(){
  renderStrip();
  const rows=DATA.filter(r=>match(r)).sort((a,b)=>(a.c??999)-(b.c??999)||String(a.nombre||'').localeCompare(String(b.nombre||''),'es'));
  $('count').innerHTML=`<b>${rows.length}</b> de ${DATA.length} reactivos`;
  $('body').innerHTML=rows.slice(0,500).map((r,i)=>{
    const pel=String(r.peligro||'').split(/[,;\/]/).map(s=>s.trim()).filter(Boolean).map(s=>`<span class="tag warn">${esc(s)}</span>`).join('');
    return `<tr class="r" data-i="${i}"><td>${esc(r.nombre||'—')}<br><span class="f">${esc(r.formula||'')}</span></td><td class="cas">${esc(r.cas||'')}</td><td class="cc">${r.c??''}</td><td>${esc(r.grupo||'')}</td><td>${esc(r.ubicacion||'')}</td><td>${esc(r.cantidad??'')} ${esc(r.unidad||'')}</td><td>${estado(r)}</td></tr>
    <tr class="det" hidden><td colspan="7"><div class="dl">${['formula','cas','carbonos','grupo','estado','pureza','marca','ubicacion','cantidad','caducidad'].map(k=>{const v=k==='carbonos'?r.c:r[k];return v!=null&&v!==''?`<div><span>${LABEL[k]}</span>${esc(v)}${k==='pureza'&&!/%/.test(v)?' %':''}</div>`:''}).join('')}${Object.entries(r.extra||{}).map(([k,v])=>`<div><span>${esc(k)}</span>${esc(v)}</div>`).join('')}${pel?`<div><span>Peligrosidad</span>${pel}</div>`:''}<div><span>Hoja de origen</span>${esc(r.hoja)}</div></div></td></tr>`}).join('');
  const e=$('empty');e.hidden=rows.length>0;
  e.textContent=DATA.length?'Ningún reactivo coincide. Ajusta o limpia los filtros.':'Carga el archivo Excel del inventario para empezar.';
}
$('strip').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const c=+b.dataset.c;SEL.has(c)?SEL.delete(c):SEL.add(c);render()});
$('body').addEventListener('click',e=>{const t=e.target.closest('tr.r');if(t)t.nextElementSibling.hidden=!t.nextElementSibling.hidden});
$('f').addEventListener('input',render);
$('f').addEventListener('submit',e=>{e.preventDefault();render()});
$('clear').addEventListener('click',()=>{$('f').reset();SEL=new Set();render()});
$('file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});
    const rows=parseBook(wb);
    if(!rows.length) throw new Error('No se encontraron filas con nombre, fórmula o CAS.');
    setData(rows,f.name,false);
    try{localStorage.setItem('inv',JSON.stringify({rows,src:f.name}))}catch(_){}
  }catch(err){$('notice').innerHTML=`<div class="notice">No se pudo leer el archivo: ${esc(err.message)}</div>`}
  e.target.value='';
});
$('demo').addEventListener('click',()=>{
  const d=(n)=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
  const R=[['Metanol','CH4O','67-56-1',1,'Alcohol','Líquido','A-1',2.5,'L',99.8,'Sigma-Aldrich',400,'Inflamable, Tóxico'],
  ['Ácido fórmico','CH2O2','64-18-6',1,'Ácido carboxílico','Líquido','A-2',1,'L',98,'Merck',30,'Corrosivo'],
  ['Etanol absoluto','C2H6O','64-17-5',2,'Alcohol','Líquido','A-1',5,'L',99.5,'J.T. Baker',-12,'Inflamable'],
  ['Acetonitrilo','C2H3N','75-05-8',2,'Nitrilo','Líquido','B-3',0,'L',99.9,'Merck',300,'Inflamable, Nocivo'],
  ['Acetona','C3H6O','67-64-1',3,'Cetona','Líquido','A-3',8,'L',99.5,'Fermont',700,'Inflamable, Irritante'],
  ['Glicerol','C3H8O3','56-81-5',3,'Alcohol','Líquido','C-1',1,'L',99,'Sigma-Aldrich',900,''],
  ['Tolueno','C7H8','108-88-3',7,'Aromático','Líquido','A-4',2,'L',99.8,'Sigma-Aldrich',60,'Inflamable, Tóxico'],
  ['Ácido benzoico','C7H6O2','65-85-0',7,'Ácido carboxílico','Sólido','D-2',500,'g',99.5,'Merck',1200,'Irritante'],
  ['Hexano','C6H14','110-54-3',6,'Alcano','Líquido','A-4',4,'L',95,'J.T. Baker',150,'Inflamable, Peligro ambiental']];
  setData(R.map(a=>({nombre:a[0],formula:a[1],cas:a[2],c:a[3],grupo:a[4],estado:a[5],ubicacion:a[6],cantidad:a[7],unidad:a[8],pureza:a[9],marca:a[10],dias:a[11],caducidad:d(a[11]),peligro:a[12],extra:{},hoja:'C'+a[3]})),'datos de ejemplo',true);
});
try{const s=JSON.parse(localStorage.getItem('inv')||'null');if(s&&s.rows&&s.rows.length)setData(s.rows,s.src+' (guardado)',false);else render()}catch(_){render()}
</script>
</body>
</html>
